<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cookbudlandingpage.css">
    <title>CookBud</title>
</head>
<body style="background-color: #ffffff;">

    <header class="header">
        <div class="logo-name">
            <h1>CookBud</h1>
        </div>
    </header>

    <main>
        <div class="parent-container">
            <div class="my-container-box">
                <h2>CookBud</h2>

                <div class="input-group">
                    <label for="account-id">
                        Username or Email
                    </label>
                    <input
                        type="text"
                        id="account-id"
                        placeholder="Enter username or email"
                    >
                </div>

                <div class="input-group">
                    <label for="account-pass">
                        Password
                    </label>
                    <input
                        type="password"
                        id="account-pass"
                        placeholder="Enter password"
                    >
                </div>

                <button class="login-btn">
                    Log In
                </button>

                <button class="register-btn">
                    Register
                </button>
            </div>
        </div>
    </main>

</body>
</html>
